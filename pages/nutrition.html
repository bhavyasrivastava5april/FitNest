    <!-- Nutrition Section -->
    <!-- Nutrition Section -->
<section class="container py-5">

    <div class="row align-items-center g-5">

        <!-- Nutrition Image -->
        <div class="col-12 col-lg-6 text-center">

            <img src="../images/nutrition.png"
                 class="img-fluid rounded page-image"
                 alt="Nutrition Guide">

        </div>


        <!-- Nutrition Form -->
        <div class="col-12 col-lg-6">

            <div class="card shadow p-4">

                <h2 class="mb-4 text-center">
                    Personalize Your Nutrition
                </h2>


                <!-- Goal -->
                <div class="mb-3">

                    <label for="goal" class="form-label">
                        What is your goal?
                    </label>

                    <select
                        class="form-select"
                        id="goal">

                        <option value="weightLoss">
                            Weight Loss
                        </option>

                        <option value="weightGain">
                            Weight Gain
                        </option>

                        <option value="muscleGain">
                            Muscle Gain
                        </option>

                        <option value="generalFitness">
                            General Fitness
                        </option>

                    </select>

                </div>


                <!-- Diet Preference -->
                <div class="mb-3">

                    <label for="diet" class="form-label">
                        Diet Preference
                    </label>

                    <select
                        class="form-select"
                        id="diet">

                        <option value="vegetarian">
                            Vegetarian
                        </option>

                        <option value="nonVegetarian">
                            Non-Vegetarian
                        </option>

                    </select>

                </div>


                <!-- Meal -->
                <div class="mb-3">

                    <label for="meal" class="form-label">
                        Meal
                    </label>

                    <select
                        class="form-select"
                        id="meal">

                        <option value="breakfast">
                            Breakfast
                        </option>

                        <option value="lunch">
                            Lunch
                        </option>

                        <option value="dinner">
                            Dinner
                        </option>

                        <option value="snack">
                            Snacks
                        </option>

                    </select>

                </div>


                <!-- Button -->
                <button
                    class="btn btn-success w-100"
                    onclick="getNutrition()">

                    Get Food Suggestions

                </button>


                <!-- Result -->
                <div id="nutritionResult"
                     class="mt-4">

                </div>

            </div>

        </div>

    </div>


    <!-- Back to Home -->
    <div class="text-center mt-5">

        <a href="../index.html"
           class="btn btn-outline-success">

            ← Back to Home

        </a>

    </div>

</section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
