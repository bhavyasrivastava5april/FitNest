<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Recommendations | FitNest</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">

        <div class="container">

            <a class="navbar-brand logo fw-bold" href="../index.html">
                🌿 FitNest
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto me-3">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="bmi.html">
                            BMI Calculator
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="water.html">
                            Water Intake
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="workout.html">
                            Workouts
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nutrition.html">
                            Nutrition
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="health.html">
                            Health
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Health Recommendation Section -->
    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <!-- Heading -->
                <div class="text-center mb-5">

                    <h1>Health Recommendations</h1>

                    <p class="text-muted">
                        Select a health concern to receive general
                        wellness and exercise guidance.
                    </p>

                </div>


                <!-- Form Card -->
                <div class="card shadow p-4">

                    <h2 class="mb-4 text-center">
                        Tell Us About Your Health
                    </h2>


                    <!-- Health Condition -->
                    <div class="mb-4">

                        <label for="condition" class="form-label">
                            Select your health concern
                        </label>

                        <select
                            class="form-select"
                            id="condition"
                            onchange="showOtherCondition()">

                            <option value="diabetes">
                                Diabetes
                            </option>

                            <option value="bloodPressure">
                                High Blood Pressure
                            </option>

                            <option value="pcos">
                                PCOS
                            </option>

                            <option value="jointProblems">
                                Joint Problems
                            </option>

                            <option value="general">
                                General Wellness
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Other Condition -->
                    <div id="otherCondition"
                         class="mb-4 d-none">

                        <label for="otherText" class="form-label">
                            Enter your health concern
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="otherText"
                            placeholder="Enter your health concern">

                    </div>


                    <!-- Recommendation Button -->
                    <button
                        class="btn btn-success w-100"
                        onclick="getHealthRecommendation()">

                        Get Recommendations

                    </button>


                    <!-- Result -->
                    <div id="healthResult" class="mt-4"></div>

                </div>

            </div>

        </div>
        <div class="text-center mt-4">
    <a href="../index.html" class="btn btn-outline-success">
        ← Back to Home
    </a>
</div>

    </section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Health JavaScript -->
    <script src="../js/health.js"></script>

</body>

</html>
