    <!-- Workout Section -->
    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <div class="text-center mb-5">

                    <h1>Find Your Workout</h1>

                    <p class="text-muted">
                        Tell us about your fitness goals and we'll suggest
                        a workout that suits you.
                    </p>

                </div>


                <!-- Workout Form -->
                <div class="card shadow p-4">

                    <h2 class="mb-4 text-center">
                        Personalize Your Workout
                    </h2>


                    <!-- Goal -->
                    <div class="mb-4">

                        <label for="goal" class="form-label">
                            What is your goal?
                        </label>

                        <select class="form-select" id="goal">

                            <option value="weightLoss">
                                Weight Loss
                            </option>

                            <option value="weightGain"
                            >Weight Gain
                            </option>

                            <option value="muscleGain">
                                Muscle Gain
                            </option>

                            <option value="generalFitness">
                                General Fitness
                            </option>

                        </select>

                    </div>


                    <!-- Fitness Level -->
                    <div class="mb-4">

                        <label for="level" class="form-label">
                            Fitness Level
                        </label>

                        <select class="form-select" id="level">

                            <option value="beginner">
                                Beginner
                            </option>

                            <option value="intermediate">
                                Intermediate
                            </option>

                            <option value="advanced">
                                Advanced
                            </option>

                        </select>

                    </div>


                    <!-- Duration -->
                    <div class="mb-4">

                        <label for="duration" class="form-label">
                            Workout Duration
                        </label>

                        <select class="form-select" id="duration">

                            <option value="15">
                                15 minutes
                            </option>

                            <option value="30">
                                30 minutes
                            </option>

                            <option value="45">
                                45 minutes
                            </option>

                            <option value="60">
                                60 minutes
                            </option>

                        </select>

                    </div>


                    <!-- Button -->
                    <button
                        class="btn btn-success w-100"
                        onclick="getWorkout()">

                        Get My Workout

                    </button>


                    <!-- Recommendation -->
                    <div id="workoutResult" class="mt-4"></div>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Workout JavaScript -->
    <script src="../js/workout.js"></script>
